# curriculum_outline.yml — der thematische Gesamtplan der DaF-Site.
#
# 5 Kurse (A1 · A2 · B1 · B2 · C1) × 12 Einheiten = 60 Einheiten.
#
# Jede Einheit trägt eine primäre GER-Fertigkeit (skills_focus) und
# ein vertieftes Goethe-Modul (goethe_module). Über einen Kurs
# hinweg ist die Modulverteilung mindestens 2× pro Modul
# (tatsächlich 3×/3×/3×/3× in dieser Fassung).
#
# Alle Themen sind aus dem DaF-Prompt (Abschnitt „Themenplan")
# genommen und stufenweise progressiv geordnet; wiederkehrende
# Figurenbesetzung wird im Front Matter jeder Kurs-index.qmd
# genannt.
#
# STATUS: Phase 2 Turn 20 — vorgeschlagen. Wartet auf
# User-Bestätigung, bevor Phase 3 (Prototyp B1) beginnt.

site: "daf-goethe"
outline_version: "2026-04-20-draft1"
courses_total: 5
units_total: 60

module_balance_target:
  per_course:
    lesen: 3
    hören: 3
    schreiben: 3
    sprechen: 3
  total_across_site:
    lesen: 15
    hören: 15
    schreiben: 15
    sprechen: 15

courses:

