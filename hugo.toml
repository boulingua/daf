baseURL = "https://boulingua.github.io/daf/"
title = "DaF — S. Le Boulanger"
languageCode = "de"
defaultContentLanguage = "de"
enableEmoji = false

[pagination]
  pagerSize = 20

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 4

[params]
  navTitle = "DaF"
  author = "S. Le Boulanger"
  description = "Ein DaF-Kursangebot entlang des Gemeinsamen Europäischen Referenzrahmens, A1 bis C1, mit GER-Modellprüfung pro Einheit."
  keywords = "DaF,Deutsch als Fremdsprache,GER,CEFR,A1,A2,B1,B2,C1,Curriculum,OER"
  dateFormat = "2006-01-02"
  hideFooter = false
  hideCredits = false
  since = 2025
  colorScheme = "auto"
  customCSS = ["css/custom.css"]

[[params.social]]
  name = "GitHub"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/boulingua/daf"

