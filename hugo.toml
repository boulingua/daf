baseURL = "https://boulingua.github.io/daf/"
title = "DaF — S. Le Boulanger"
languageCode = "de"
defaultContentLanguage = "de"
enableEmoji = false
enableRobotsTXT = true

[pagination]
  pagerSize = 20

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 4

[params]
  # The registry key. boulingua.yml says `code: daf` and asserts it "must match
  # [params].code" — and [params].code did not exist, so the kit's accent
  # injection resolved to the neutral template grey. The claim was true and
  # unenforced; gate A11 checks it now.
  code = "daf"
  license = "CC BY-SA 4.0"
  navTitle = "DaF"
  author = "S. Le Boulanger"
  description = "Ein DaF-Kursangebot entlang des Gemeinsamen Europäischen Referenzrahmens, A1 bis C1, mit GER-Modellprüfung pro Einheit."
  keywords = "DaF,Deutsch als Fremdsprache,GER,CEFR,A1,A2,B1,B2,C1,Curriculum,OER"
  dateFormat = "2006-01-02"
  hideFooter = false
  hideCredits = false
  since = 2025
  colorScheme = "auto"
  # The colour-scheme toggle is rendered as a labelled control in the
  # navbar (layouts/_partials/header.html) and bound by the theme's
  # coder.js via #dark-mode-toggle; disable the theme's floating
  # duplicate so there is exactly one toggle element on the page.
  hideColorSchemeToggle = true
  customCSS = ["css/custom.css"]

  # IMPORTANT — sub-tables under [params] must come AFTER all bare
  # [params] keys, because TOML scopes everything that follows a header
  # to that header until the next one. (We learned this the hard way:
  # opening [params.plausible] before description/colorScheme/customCSS
  # silently moved every key after it under params.plausible, leaving
  # the site unstyled in production.)
  # Two self-hosted faces, preloaded. They are declared here rather than in a
  # copy of the kit's head partial, which is what this repo used to carry.
  font_preload = [
    "fonts/source-sans-3-v19-latin_latin-ext-regular.woff2",
    "fonts/jetbrains-mono-v24-latin_latin-ext-regular.woff2",
  ]

  [params.plausible]
    # Per-site values; sister repos (efl/fle/ressources) override their own.
    # script.file-downloads.outbound-links.js preserved from the Quarto era
    # by explicit author preference; both PII-free.
    domain = "boulingua.github.io/daf"
    src = "https://analytics.hellebo.de/js/script.file-downloads.outbound-links.js"

[[params.social]]
  name = "GitHub"
  icon = "fa-brands fa-github fa-2x"
