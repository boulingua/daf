[module]
  # Import order is load-bearing, and it is the opposite of what reads
  # naturally. Hugo resolves module files FIRST-MATCH-WINS in the order they
  # are listed, so the kit must come BEFORE hugo-coder to override it. Listed
  # after, the theme's own empty body/extensions.html and head/extensions.html
  # stubs win and the kit's are never reached — which silently removed every
  # VG Wort pixel, the accent injection and the font preloads from this site
  # while the build stayed green.
  [[module.imports]]
    path = "github.com/boulingua/kit"
  [[module.imports]]
    path = "github.com/luizdepra/hugo-coder"

