# Goethe-Zertifikat B1 — Prüfungsformat
#
# Quelle: "Zertifikat B1 — Modellsatz Erwachsene"
# (Vs_11_070115, 2. überarbeitete Auflage Januar 2015),
# Gemeinschaftsprodukt Goethe-Institut e. V. / Österreichisches
# Sprachdiplom (ÖSD) / Universität Freiburg/Schweiz 2013.
# ISBN 978-3-939670-88-9 (Modellsatz Erwachsene),
# Prüfungsziele/Testbeschreibung: ISBN 978-3-19-031868-1.
#
# Abgerufen: 2026-04-20
# URL: https://www.goethe.de/pro/relaunch/prf/materialien/B1/b1_modellsatz_erwachsene.pdf
# Referenz: https://www.goethe.de/gzb1

cefr_level: "B1"
zertifikat: "Goethe-Zertifikat B1 / Zertifikat B1"
trinational: true                    # Goethe / ÖSD / Univ. Freiburg CH
zielgruppe: "Erwachsene (ab 16 Jahren). Parallelformat: Zertifikat B1 für Jugendliche (ab 12 Jahren)."
modularer_aufbau: true               # Module einzeln ablegbar
gesamtpunkte_pro_modul: 100
bestehensgrenze_pro_modul_prozent: 60
bestehensgrenze_pro_modul_punkte: 60
prüfungssprache: "Deutsch"
hilfsmittel_erlaubt: false           # Wörterbücher, Mobiltelefone nicht erlaubt

module:

  lesen:
    gewichtung_punkte_eigenständig: 100
    dauer_minuten: 65
    anzahl_teile: 5
    gesamt_items: 30
    teile:
      - nummer: 1
        prüfungsziel: "Korrespondenz lesen"
        aufgabentyp: "Richtig / Falsch"
        items: 6
        arbeitszeit_minuten: 10
      - nummer: 2
        prüfungsziel: "Information und Argumentation verstehen"
        aufgabentyp: "Mehrfachauswahl (3-gliedrig)"
        items: 6
        arbeitszeit_minuten: 20
      - nummer: 3
        prüfungsziel: "Zur Orientierung lesen"
        aufgabentyp: "Zuordnung"
        items: 7
        arbeitszeit_minuten: 10
      - nummer: 4
        prüfungsziel: "Information und Argumentation verstehen"
        aufgabentyp: "Ja / Nein (Meinungsäußerung in Leserbriefen)"
        items: 7
        arbeitszeit_minuten: 15
      - nummer: 5
        prüfungsziel: "Schriftliche Anweisung verstehen"
        aufgabentyp: "Mehrfachauswahl (3-gliedrig)"
        items: 4
        arbeitszeit_minuten: 10

  hören:
    gewichtung_punkte_eigenständig: 100
    dauer_minuten: 40
    anzahl_teile: 4
    gesamt_items: 30
    teile:
      - nummer: 1
        prüfungsziel: "Ankündigungen, Durchsagen und Anweisungen verstehen"
        aufgabentyp: "Richtig/Falsch und Mehrfachauswahl (3-gliedrig)"
        items: 10
        hört_wie_oft: 1
      - nummer: 2
        prüfungsziel: "Als Zuschauer/Zuhörer im Publikum verstehen (Vortrag, Führung)"
        aufgabentyp: "Mehrfachauswahl (3-gliedrig)"
        items: 5
        hört_wie_oft: 1
      - nummer: 3
        prüfungsziel: "Gespräche zwischen Muttersprachlern verstehen"
        aufgabentyp: "Richtig / Falsch"
        items: 7
        hört_wie_oft: 1
      - nummer: 4
        prüfungsziel: "Radiosendungen und Tonaufnahmen verstehen (Diskussion)"
        aufgabentyp: "Zuordnung (Meinung → Person)"
        items: 8
        hört_wie_oft: 2

  schreiben:
    gewichtung_punkte_eigenständig: 100
    dauer_minuten: 60
    anzahl_teile: 3
    teile:
      - nummer: 1
        prüfungsziel: "Interaktion: persönliche Mitteilung zur Kontaktpflege"
        aufgabentyp: "Freies Schreiben (beschreiben, begründen, einen Vorschlag machen)"
        arbeitszeit_minuten: 20
        wörter_richtwert: 80
      - nummer: 2
        prüfungsziel: "Produktion: persönliche Meinung zu einem Thema äußern (Leserkommentar)"
        aufgabentyp: "Freies Schreiben (beschreiben, begründen, erläutern, vergleichen, Meinung äußern)"
        arbeitszeit_minuten: 25
        wörter_richtwert: 80
      - nummer: 3
        prüfungsziel: "Interaktion: persönliche Mitteilung zur Handlungsregulierung"
        aufgabentyp: "Freies Schreiben (sich entschuldigen, um etwas bitten o. Ä.)"
        arbeitszeit_minuten: 15
        wörter_richtwert: 40
    bewertungskriterien:
      skala: "A / B / C / D / E"
      dimensionen_pro_aufgabe_1:
        - "Erfüllung (Inhalt, Umfang, Sprachfunktionen)"
        - "Kohärenz (Textaufbau, Verknüpfung)"
        - "Wortschatz (Spektrum + Beherrschung)"
        - "Strukturen (Spektrum + Beherrschung: Morphologie, Syntax, Orthografie)"
      dimensionen_pro_aufgabe_2:
        - "Erfüllung (Inhalt, Umfang, Meinungsäußerung)"
        - "Register/Soziokulturelle Angemessenheit"
        - "Wortschatz"
        - "Strukturen"
      dimensionen_pro_aufgabe_3:
        - "Erfüllung (Mitteilung, Inhalt)"
        - "Register/Soziokulturelle Angemessenheit"
        - "Wortschatz"
        - "Strukturen"
      ko_regel: >-
        Textumfang < 50 % der geforderten Wortanzahl oder Thema
        verfehlt → Aufgabe insgesamt E (0 Punkte).

  sprechen:
    gewichtung_punkte_eigenständig: 100
    dauer_minuten: 15                # pro 2 Teilnehmende
    format: "Paarprüfung — 2 Teilnehmende, 2 Prüfende (Moderator/in + Bewerter/in)"
    vorbereitungszeit_minuten: 15    # Präsentation wird vorher vorbereitet
    anzahl_teile: 3
    teile:
      - nummer: 1
        prüfungsziel: "Interaktion: gemeinsam etwas planen und aushandeln"
        aufgabentyp: "Planungsdialog anhand von 4 Leitpunkten"
        material: "Planungskarte mit 4 Notizpunkten (z. B. Krankenbesuch, Geschenk, Unterstützung)"
      - nummer: 2
        prüfungsziel: "Produktion: in einem Monolog ein Thema präsentieren"
        aufgabentyp: "Präsentation anhand von 5 vorgegebenen Folien"
        material: "Folienset, Einleitung + Hauptteil + Beispiele + Situation im eigenen Land + Vor-/Nachteile + Abschluss"
      - nummer: 3
        prüfungsziel: "Interaktion: situationsadäquat reagieren"
        aufgabentyp: "Feedback + Frage zur Präsentation der anderen Person; auf Rückfragen der Prüfenden reagieren"
    bewertungskriterien:
      skala: "A / B / C / D / E"
      dimensionen:
        - "Erfüllung der Aufgabe (Angemessenheit, situations- und partneradäquat)"
        - "Kohärenz (Satzverknüpfung, Redefluss)"
        - "Wortschatz (Spektrum + Beherrschung)"
        - "Strukturen (Spektrum + Beherrschung)"
        - "Aussprache (Satzmelodie, Wortakzent, einzelne Laute)"

# Globale Kann-Beschreibung B1 (verbatim Vorwort):
kompetenzbeschreibung_b1: |
  Mit erfolgreichem Ablegen der Prüfung haben Teilnehmende
  nachgewiesen, dass sie sich in allen wichtigen Alltagssituationen
  sprachlich zurechtfinden, wenn die Gesprächspartner klare
  Standardsprache verwenden. Sie können:
  - die Hauptinformationen verstehen, wenn klare Standardsprache
    verwendet wird und es um vertraute Dinge aus Arbeit, Schule,
    Freizeit usw. geht;
  - die meisten Situationen bewältigen, denen man auf Reisen in
    deutschsprachigen Ländern begegnet;
  - sich einfach und zusammenhängend über vertraute Themen und
    persönliche Interessensgebiete äußern;
  - über Erfahrungen und Ereignisse berichten und Träume,
    Hoffnungen und Ziele beschreiben sowie kurze Begründungen oder
    Erklärungen geben.

note_für_unit_design: |
  B1 ist der Prototyp-Kurs dieser DaF-Site (Phase 3 des DaF-Prompts).
  Pro Einheit eines DaF-B1-Kurses (12 Einheiten insgesamt) wird ein
  Prüfungsteil vertieft (Lesen, Hören, Schreiben, Sprechen), damit
  im Kurs alle vier Module mindestens dreimal geübt werden.
  Stimulustexte ausnahmslos original von S. Le Boulanger — keine
  Reproduktion echter Modellsatz-Texte.
  Der modulare Aufbau der B1-Prüfung erlaubt pro Einheit eine
  einzelne Modulsimulation ohne 165-min-Gesamtprüfung.
