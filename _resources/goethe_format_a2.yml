# Goethe-Zertifikat A2 — Prüfungsformat
#
# Quelle: "Goethe-Zertifikat A2 — Modellsatz Erwachsene"
# (Vs4.9_270916, 1. Auflage 2016), herausgegeben vom
# Goethe-Institut e. V., ISBN 978-3-19-051868-5.
#
# Abgerufen: 2026-04-20
# URL: https://www.goethe.de/pro/relaunch/prf/materialien/A2/A2_Modellsatz_Erwachsene.pdf
# Referenz-Übersicht: https://www.goethe.de/de/spr/kup/prf/prf.html
#
# Strukturdaten (Teile, Aufgabentypen, Items, Zeiten, Punkte,
# Bestehensgrenzen, Bewertungsschemata) verbatim aus Modellsatz
# „Prüfungsteile im Überblick" und „Bewertungskriterien".

cefr_level: "A2"
zertifikat: "Goethe-Zertifikat A2"
zielgruppe: "Erwachsene (ab 16 Jahren). Parallelformat für Jugendliche: Goethe-Zertifikat A2 Fit in Deutsch."
löst_ab: "Start Deutsch 2"
gesamtdauer_minuten: 105             # 30 + 30 + 30 + 15
gesamtpunkte: 100
bestehensgrenze_punkte: 60
bestehensgrenze_prozent: 60
prüfungssprache: "Deutsch"
hilfsmittel_erlaubt: false           # Wörterbücher + Mobiltelefone nicht erlaubt

# Schriftlich / Mündlich Grenzwerte (aus Vorwort):
schriftlich_max_punkte: 75           # Lesen + Hören + Schreiben
schriftlich_min_punkte: 45           # Für Bestätigung A2 im schriftlichen Teil
mündlich_max_punkte: 25              # Sprechen
mündlich_min_punkte: 15

# Rohpunkt-Umrechnung:
# "In den Prüfungsteilen Lesen, Hören und Schreiben wird das Ergebnis
# von 20 Messpunkten mit 1,25 multipliziert" → 20 Rohpunkte → 25.
punkt_umrechnung:
  lesen_hoeren_schreiben:
    rohpunkte_max: 20
    faktor: 1.25
    zertifikat_punkte_max: 25
  sprechen:
    rohpunkte_max: 25
    faktor: 1.0
    zertifikat_punkte_max: 25

module:

  lesen:
    gewichtung_punkte: 25
    dauer_minuten: 30
    anzahl_teile: 4
    gesamt_items: 20
    punkte_pro_item: 1
    teile:
      - nummer: 1
        prüfungsziel: "Informationen und Argumentationen in Medientexten verstehen"
        aufgabentyp: "Mehrfachauswahl, 3-gliedrig"
        items: 5
      - nummer: 2
        prüfungsziel: "Informationstafeln, Veranstaltungsprogramme etc. verstehen"
        aufgabentyp: "Mehrfachauswahl, 3-gliedrig"
        items: 5
      - nummer: 3
        prüfungsziel: "Korrespondenz verstehen"
        aufgabentyp: "Mehrfachauswahl, 3-gliedrig"
        items: 5
      - nummer: 4
        prüfungsziel: "Anzeigen verstehen"
        aufgabentyp: "Zuordnen (Situationen zu Anzeigen)"
        items: 5

  hören:
    gewichtung_punkte: 25
    dauer_minuten: 30
    anzahl_teile: 4
    gesamt_items: 20
    punkte_pro_item: 1
    teile:
      - nummer: 1
        prüfungsziel: "Informationen im Radio, auf dem Anrufbeantworter, bei Durchsagen verstehen"
        aufgabentyp: "Mehrfachauswahl, 3-gliedrig"
        items: 5
        hört_wie_oft: 1              # laut Transkript-Hinweisen der Vorlage
      - nummer: 2
        prüfungsziel: "Ein zusammenhängendes Gespräch verstehen"
        aufgabentyp: "Zuordnen Bild/Text"
        items: 5
      - nummer: 3
        prüfungsziel: "Einzelgespräche verstehen"
        aufgabentyp: "Mehrfachauswahl, 3-gliedrig (Bild/Text)"
        items: 5
        hört_wie_oft: 1
      - nummer: 4
        prüfungsziel: "Ein Radiointerview verstehen"
        aufgabentyp: "Richtig/Falsch (Ja/Nein)"
        items: 5
        hört_wie_oft: 2

  schreiben:
    gewichtung_punkte: 25
    dauer_minuten: 30
    anzahl_teile: 2
    rohpunkte_gesamt_max: 20         # 2 Teile × 2 Dimensionen × max 5 = 20
    hilfsmittel_erlaubt: false
    teile:
      - nummer: 1
        prüfungsziel: "Interaktion: persönliche Mitteilung zur Kontaktpflege schreiben"
        aufgabentyp: "Freies Schreiben — SMS / Kurznachricht"
        geforderter_umfang_wörter_min: 20
        sprachfunktionen: 3
      - nummer: 2
        prüfungsziel: "Interaktion: halb offizielle Mitteilung zur Handlungsregulierung schreiben"
        aufgabentyp: "Freies Schreiben — E-Mail"
        geforderter_umfang_wörter_min: 30
        sprachfunktionen: 3
    bewertungskriterien:
      skala: "A (5 P.) / B (3.5 P.) / C (2 P.) / D (0.5 P.) / E (0 P.)"
      dimensionen:
        aufgabenerfüllung:
          aspekte: ["Sprachfunktion", "Register", "Textumfang"]
          a: "alle 3 Sprachfunktionen inhaltlich und umfänglich angemessen; situations- und partneradäquat"
          b: "2 Sprachfunktionen angemessen oder 1 angemessen + 2 teilweise; weitgehend situations- und partneradäquat"
          c: "1 Sprachfunktion angemessen und 1 teilweise oder alle teilweise; ansatzweise situations- und partneradäquat"
          d: "1 Sprachfunktion angemessen oder teilweise; nicht mehr situations- und partneradäquat"
          e: "Textumfang weniger als 50 % der geforderten Wortanzahl (10 W. in Teil 1; 15 W. in Teil 2) oder Thema verfehlt"
          ko_regel: >-
            Wird Aufgabenerfüllung mit E (0) bewertet, ist die
            Gesamtpunktzahl dieser Aufgabe 0.
        sprache:
          aspekte: ["Spektrum: Kohärenz / Wortschatz / Strukturen", "Beherrschung"]
          a: "angemessen und differenziert; vereinzelte Fehlgriffe beeinträchtigen das Verständnis nicht"
          b: "überwiegend angemessen; mehrere Fehlgriffe beeinträchtigen das Verständnis nicht"
          c: "teilweise angemessen; mehrere Fehlgriffe beeinträchtigen das Verständnis teilweise"
          d: "kaum angemessen; mehrere Fehlgriffe beeinträchtigen das Verständnis erheblich"
          e: "Text durchgängig unangemessen"

  sprechen:
    gewichtung_punkte: 25
    dauer_minuten: 15
    format: "Paarprüfung — 15 Minuten pro 2 Teilnehmende, 2 Prüfende (Moderator/in + Bewerter/in)"
    vorbereitungszeit_minuten: 0
    anzahl_teile: 3
    teile:
      - nummer: 1
        prüfungsziel: "Interaktion: Informationen zur Person mit einem Partner/einer Partnerin austauschen"
        aufgabentyp: "Freies Sprechen — Partnerdialog mit vier Karten"
        material: "vier Karten mit Stichworten (z. B. Familie, Beruf, Hobbys)"
      - nummer: 2
        prüfungsziel: "Produktion: dem/der Prüfenden ausführlich nähere Informationen zum eigenen Leben geben"
        aufgabentyp: "Freies Sprechen — Monolog mit Zusatzfragen"
        material: "Aufgabenblatt, ca. 20 Sekunden Lesezeit"
      - nummer: 3
        prüfungsziel: "Interaktion: mit einem Partner/einer Partnerin eine Unternehmung planen und aushandeln"
        aufgabentyp: "Freies Sprechen — Aushandlungsdialog"
        material: "Aufgabenblatt mit Planungsaufgabe (z. B. Geburtstagsgeschenk)"
    bewertungskriterien:
      skala_aufgabenerfüllung: "A (5) / B (3.5) / C (2) / D (0.5) / E (0)"
      skala_sprache: "A (4) / B (3) / C (2) / D (1) / E (0)"
      skala_aussprache: "A (2) / B (1.5) / C (1) / D (0.5) / E (0)"  # einmal über alle Teile bewertet
      dimensionen:
        aufgabenerfüllung:
          aspekte: ["Sprachfunktion", "Interaktion", "Register", "Gesprächsanteil"]
          a: "angemessen; situations- und partneradäquat"
          b: "überwiegend angemessen; weitgehend situations- und partneradäquat"
          c: "teilweise angemessen; ansatzweise situations- und partneradäquat"
          d: "kaum angemessen; nicht mehr situations- und partneradäquat"
          e: "Gesprächsanteil nicht bewertbar"
          ko_regel: >-
            Wird Aufgabenerfüllung mit E (0) bewertet, ist die
            Gesamtpunktzahl dieser Aufgabe 0.
        sprache:
          aspekte: ["Spektrum: Wortschatz / Strukturen", "Beherrschung"]
          a: "angemessen und differenziert; vereinzelte Fehlgriffe"
          b: "überwiegend angemessen; mehrere Fehlgriffe beeinträchtigen das Verständnis nicht"
          c: "teilweise angemessen; mehrere Fehlgriffe beeinträchtigen das Verständnis teilweise"
          d: "kaum angemessen; erhebliche Verständnisbeeinträchtigung"
          e: "Äußerung durchgängig unangemessen"
        aussprache:
          aspekte: ["Satzmelodie", "Wortakzent", "einzelne Laute"]
          a: "einzelne Abweichungen beeinträchtigen das Verständnis nicht"
          b: "systematisch vorkommende Abweichungen beeinträchtigen das Verständnis nicht"
          c: "Abweichungen beeinträchtigen das Verständnis stellenweise"
          d: "starke Abweichungen beeinträchtigen das Verständnis erheblich"
          e: "nicht mehr verständlich"

# Globalskala A2 — Kompetenzbeschreibung (verbatim Vorwort):
kompetenzbeschreibung_a2: |
  Die Prüfungsteilnehmer und Prüfungsteilnehmerinnen weisen mit
  dem erfolgreichen Ablegen aller Prüfungsteile nach, dass sie
  - Sätze und häufig gebrauchte Ausdrücke verstehen, die im Alltag
    vorkommen (Information zur Person und Familie, Einkaufen,
    Schule, nähere Umgebung);
  - sich in einfachen routinemäßigen Situationen verständigen
    können, in denen es um direkten Austausch von Informationen
    über vertraute und geläufige Dinge geht;
  - mit einfachen Mitteln die eigene Herkunft und Ausbildung, die
    direkte Umgebung und Dinge im Zusammenhang mit unmittelbaren
    Bedürfnissen beschreiben können.

note_für_unit_design: |
  Stimulustexte für die DaF-Site werden pro Einheit original von
  S. Le Boulanger verfasst und folgen Aufgabentyp, Itemzahl und
  Zeitvorgabe des offiziellen A2-Modellsatzes. Echte
  Goethe-Modellsatz-Texte werden nicht reproduziert.
