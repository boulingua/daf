name: Link check

on:
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC
  pull_request:
    paths:
      - "content/**"
      - "layouts/**"
      - "static/**"
      - "data/**"
      - "hugo.toml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # for create-issue-from-file

defaults:
  run:
    shell: bash

jobs:
  links:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.159.2"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        # Hugo Modules resolve the theme through the Go toolchain, so the
        # version has to come from go.mod — never a literal that can drift.
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install pyyaml

      - name: Build graph (so /network/graph.json exists)
        run: python scripts/build_graph.py

      - name: Set up Node (for the Materials Network bundle)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm deps for the Materials Network bundle
        run: npm ci --no-audit --no-fund

      - name: Build site (flat baseURL so href paths map 1:1 to public/)
        env:
          HUGO_ENVIRONMENT: production
          TZ: Europe/Berlin
        # baseURL "/" makes Hugo emit '/foo/' hrefs that lychee resolves
        # as <root-dir>/foo/index.html. The production deploy uses the
        # full baseURL via .github/workflows/hugo.yml — this build is
        # a throwaway just for link-checking.
        run: hugo --minify --baseURL "/"

      # Unit front-matter hard-codes the production deploy path (/daf/materials/...);
      # those files live at public/materials/ in this flat build. Bridge the prefix
      # so lychee resolves them (materials holds no HTML, so no glob recursion).
      - name: Bridge /daf/ deploy-path prefix for link check
        run: |
          mkdir -p public/daf
          ln -sfn ../materials public/daf/materials

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Run lychee on built site (HTML)
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --cache
            --max-cache-age 1d
            --accept 200,206,301,302,308,429
            --exclude-path public/network
            --root-dir ${{ github.workspace }}/public
            './public/**/*.html'
          fail: true
          jobSummary: true

      - name: Run lychee on network graph URLs
        # Network nodes carry article URLs that the rendered HTML doesn't
        # link directly. Pull them straight out of graph.json.
        run: |
          python - <<'PY' > /tmp/network-urls.txt
          import json, pathlib
          data = json.loads(pathlib.Path("public/network/graph.json").read_text(encoding="utf-8"))
          for n in data["nodes"]:
              u = n.get("url")
              if not u:
                  continue
              if u.startswith("http"):
                  print(u)
              else:
                  # Produce live-deploy URLs for the network's article URLs;
                  # local file resolution would need the daf/ prefix that we
                  # explicitly stripped from this build, so check live instead.
                  print("https://boulingua.github.io/daf" + u)
          PY
          # lychee is a Rust binary already on PATH from lycheeverse/lychee-action
          # above (it is not an npm package, so `npx lychee` fails).
          lychee --no-progress --cache --max-cache-age 1d \
            --accept 200,206,301,302,308,429 \
            /tmp/network-urls.txt
